services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: tabish
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: tasksdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabish"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tabish:secret@db:5432/tasksdb
      LLM_BASE_URL: https://openrouter.ai/api/v1
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: openrouter/free
      LLM_STUB: "0"
      LLM_ENABLED: "true"

volumes:
  pgdata: